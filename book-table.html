<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Moon+Dance&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">




</head>

<body>
    <section class="h-screen w-full mt-12 font-[Poppins] text-slate-800">
        <div class="book-table-header  text-center items-center">
              <p class="cooking text-2xl  text-red-700"> Book a Table</p>
              <h1 class="text-6xl text-black font-extrabold">Make a <span class="text-red-700 hover:text-amber-500"> Reservation </span></h1>
              <hr class="border-red-700 border-4 rounded-3xl w-[120px]  mx-auto ">
            
            </div>




        <div class=" book-table  grid grid-cols-2 max-w-7xl  mx-auto  md:grid-cols-2 lg:grid-cols-2">
            <div  class="h-[500px] w-[500px] bg-[#1a1a1a] border-4 mt-16 text-white pl-8 rounded-3xl  flex-row gap-4 pt-8">
                <h1 class="text-3xl font-bold">Contact Info</h1>
                <p class="text-gray-400">We're happy to help you plan 
                the perfect dining  <br>experience.
                </p>

                <div class="flex text-center items-center mt-3 ">
                    <i class="fa-regular fa-clock  text-red-500 px-12 py-2 text-3xl rounded-2xl pl-3 mt-4  bg-[#a58c8c]  "></i>
                    <div>

                        <p class="text-2xl text-gray-300 pl-2 mt-4">Opening Hours</p>
                        <span class=" pl-2 text-md ml-0.5">Mon - Sun, 8 AM - 11 PM</span>
                    </div>
                          </div>



                          <div class="flex  items-center mt-3 ">
                    <i class="fa-solid fa-phone text-red-500 px-12 py-2 text-3xl rounded-2xl pl-3 mt-4 bg-[#a58c8c]"></i>
                    <div>

                        <p class="text-2xl text-gray-300 pl-2 mt-4">Contact</p>
                        <span class=" pl-2 text-md ml-0.5">+91 ............</span>
                    </div>
                          </div>



                          <div class="flex  items-center mt-3 ">
                    <i class="fa-solid fa-users text-red-500 px-12 py-2 text-3xl rounded-2xl pl-3 mt-4 bg-[#a58c8c]"></i>
                    <div>

                        <p class="text-2xl text-gray-300 pl-2  mt-4">Group Dining</p>
                        <span class=" pl-2 text-md ml-0.5">Private dining for 10–50 guests</span>
                    </div>
                          </div>



                          <div class="flex text-center items-center mt-3 ">
                    <i class="fa-solid fa-location-dot text-red-500 px-12 py-2 text-3xl rounded-2xl pl-3 mt-4 bg-[#a58c8c]"></i>
                    <div>

                        <p class="text-2xl text-gray-300 pl-2 mt-4">Location</p>
                        <span class=" pl-2 text-md ml-0.5">Gopalpura</span>
                    </div>
                          </div>
                          

            </div>




            <div  class=" bg-[white] rounded-3xl  mt-16 grid grid-cols-2  mx-auto md:grid-cols-2 lg:grid-cols-2">
                <div>
                <form action="">
                    <label for="name" class="block text-base font-medium text-slate-700">Full Name-:</label>
                    <input type="text" class="ml-0 mt-2 border border-red-500 rounded-2xl px-14 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-300 hover:border-red-600"
                        name="name" id="name">

                        <label for="email" class="block text-base mt-4 font-medium text-slate-700">Email Address-:</label>
                    <input type="email" class="ml-0 mt-2 border border-red-500 rounded-2xl px-14 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-300 hover:border-red-600"
                        name="email" id="email">
                    
                    <label for="phone" class="block text-base mt-4 font-medium text-slate-700">Phone Number-:</label>
                    <input type="tel" class="ml-0 mt-2 border border-red-500 rounded-2xl px-14 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-red-300 hover:border-red-600"
                        name="phone" id="phone">

                </form>
               </div>


               <div>

                   <form action="">
                       

                </form>
            </div>
            </div>

            
        </div>
    </section>
</body>

</html>
